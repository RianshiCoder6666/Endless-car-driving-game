<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Car driving game</title>
    <link rel="icon" type="image/jpeg" href="./images/logo.jpg">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3/planck.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3/p5play.js"></script>


    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body>
    <div id="gameModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-lg p-8 max-w-sm w-full mx-auto text-center shadow 2xl duration-300">
            <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-2"> Game Over! </h2>
            <button id="modalButton" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-6 rounded-lg transition duration-200">
                Play Again
            </button> 
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
